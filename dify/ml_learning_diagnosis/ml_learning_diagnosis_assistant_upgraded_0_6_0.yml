        selected: false
        title: RAG片段去重与证据整理_代码节点
        type: code
        code: "import json\nimport re\n\ndef _as_text(value):\n    if value is None:\n        return \"\"\n    if isinstance(value, str):\n        return value\n    try:\n        return json.dumps(value, ensure_ascii=False)\n    except Exception:\n        return str(value)\n\ndef _load(value):\n    if isinstance(value, (list, dict)):\n        return value\n    text = _as_text(value).strip()\n    if not text:\n        return []\n    try:\n        return json.loads(text)\n    except Exception:\n        return text\n\ndef _docs(value, source_type):\n    value = _load(value)\n    docs = []\n    if isinstance(value, dict):\n        for key in [\"documents\", \"result\", \"records\", \"data\"]:\n            if isinstance(value.get(key), list):\n                value = value[key]\n                break\n        else:\n            value = [value]\n    if isinstance(value, list):\n        for i, item in enumerate(value):\n            if isinstance(item, dict):\n                metadata = item.get(\"\
          metadata\") or {}\n                segment = item.get(\"segment\") or {}\n                content = (\n                    item.get(\"content\")\n                    or item.get(\"text\")\n                    or item.get(\"page_content\")\n                    or segment.get(\"content\")\n                    or metadata.get(\"content\")\n                    or _as_text(item)\n                )\n                title = item.get(\"title\") or item.get(\"nodeLabel\") or metadata.get(\"document_name\") or metadata.get(\"source\") or segment.get(\"document\", {}).get(\"name\") or source_type\n                score = item.get(\"score\") or item.get(\"similarity\") or item.get(\"rerank_score\") or 0\n            else:\n                content = _as_text(item)\n                title = source_type\n                score = 0\n            docs.append({\"content\": _as_text(content), \"title\": _as_text(title), \"score\": float(score or 0), \"source_type\": source_type, \"idx\": i + 1})\n    else:\n        parts = [p.strip()\
          \ for p in re.split(r\"\\n\\s*\\n\", _as_text(value)) if p.strip()]\n        for i, part in enumerate(parts[:8]):\n            docs.append({\"content\": part, \"title\": source_type, \"score\": 0, \"source_type\": source_type, \"idx\": i + 1})\n    return docs\n\ndef _key(text):\n    text = re.sub(r\"\\s+\", \"\", text.lower())\n    return text[:120]\n\ndef main(course_context=\"\", misconception_context=\"\", project_course_context=\"\", project_misconception_context=\"\", graph_db_context=\"\") -> dict:\n    all_docs = _docs(graph_db_context, \"Project knowledge graph database\") + _docs(project_course_context, \"Project course materials\") + _docs(project_misconception_context, \"Project misconception bank\") + _docs(course_context, \"Dify course knowledge base\") + _docs(misconception_context, \"Dify misconception knowledge base\")\n    seen = set()\n    deduped = []\n    for doc in all_docs:\n        content = re.sub(r\"\\s+\", \" \", doc[\"content\"]).strip()\n        if not content:\n            continue\n        key = _key(content)\n        if key in seen:\n            continue\n        seen.add(key)\n        doc[\"content\"] = content[:650]\n        deduped.append(doc)\n    deduped.sort(key=lambda x: (x[\"score\"], len(x[\"content\"])), reverse=True)\n    selected = deduped[:5]\n    citations = []\n\
          \    lines = []\n    for i, doc in enumerate(selected, 1):\n        item = {\n            \"id\": f\"E{i}\",\n            \"source\": doc[\"source_type\"],\n            \"title\": doc[\"title\"],\n            \"score\": round(doc[\"score\"], 4),\n            \"content\": doc[\"content\"],\n        }\n        citations.append(item)\n        lines.append(f\"[E{i}] {doc['source_type']}｜{doc['title']}｜{doc['content']}\")\n    evidence_summary = \"\\n\".join(lines) if lines else \"未检索到足够证据。请确认教师端已上传并发布课程资料，或在 Dify 中绑定课程知识库、题库和错因知识库。\"\n    return {\n        \"evidence_summary\": evidence_summary,\n        \"citation_items\": json.dumps(citations, ensure_ascii=False),\n        \"evidence_count\": len(citations),\n    }"
        code_language: python3
        outputs:
          evidence_summary:
            children: null
            type: string
          citation_items:
            children: null
            type: string
          evidence_count:
            children: null
            type: number
