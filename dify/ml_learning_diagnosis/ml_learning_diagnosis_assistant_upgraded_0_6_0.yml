        selected: false
        title: 输入清洗与任务识别_代码节点
        type: code
        code: "import json\nimport re\n\nTOPIC_KEYWORDS = {\n    \"机器学习基础\": [\"机器学习\", \"监督学习\", \"无监督学习\", \"强化学习\", \"泛化\", \"归纳偏置\", \"训练集\", \"测试集\"],\n    \"KNN\": [\"KNN\", \"K近邻\", \"最近邻\", \"距离\", \"投票\", \"K值\", \"标准化\"],\n    \"线性回归\": [\"线性回归\", \"平方损失\", \"均方误差\", \"MSE\", \"梯度下降\", \"学习率\"],\n    \"逻辑回归\": [\"逻辑回归\", \"Sigmoid\", \"交叉熵\", \"二分类\", \"精确率\", \"召回率\", \"F1\"],\n    \"SVM\": [\"SVM\", \"支持向量机\", \"支持向量\", \"最大间隔\", \"核函数\", \"C\", \"gamma\"],\n    \"决策树\": [\"决策树\", \"信息增益\", \"基尼\", \"剪枝\", \"CART\", \"ID3\", \"C4.5\"],\n    \"集成学习\": [\"集成学习\", \"随机森林\", \"Bagging\", \"Boosting\", \"GBDT\", \"AdaBoost\"],\n    \"KMeans聚类\": [\"KMeans\", \"K均值\", \"聚类\", \"簇中心\", \"SSE\", \"轮廓系数\"],\n    \"PCA降维\": [\"PCA\", \"主成分\", \"降维\", \"协方差\", \"特征值\", \"解释方差率\"],\n    \"朴素贝叶斯\": [\"朴素贝叶斯\", \"贝叶斯\", \"先验\", \"似然\", \"后验\", \"条件独立\"],\n    \"神经网络\": [\"神经网络\", \"感知机\", \"反向传播\", \"激活函数\", \"ReLU\", \"Dropout\"],\n    \"EM与GMM\": [\"EM\", \"GMM\", \"高斯混合\", \"隐变量\", \"E步\"\
          , \"M步\"],\n    \"自编码器\": [\"自编码器\", \"编码器\", \"解码器\", \"重构误差\", \"隐表示\"],\n}\n\ndef _text(value):\n    if value is None:\n        return \"\"\n    if isinstance(value, str):\n        return value\n    try:\n        return json.dumps(value, ensure_ascii=False)\n    except Exception:\n        return str(value)\n\ndef _clean(value, limit):\n    value = re.sub(r\"\\s+\", \" \", _text(value)).strip()\n    return value[:limit]\n\ndef _norm_option(value, allowed, default):\n    value = _clean(value, 40)\n    return value if value in allowed else default\n\ndef _extract_keywords(text):\n    lower = text.lower()\n    hits = []\n    for topic, kws in TOPIC_KEYWORDS.items():\n        score = 0\n        for kw in kws:\n            if kw.lower() in lower:\n                score += 1\n                hits.append(kw)\n        if score:\n            hits.append(topic)\n    tokens = re.findall(r\"[A-Za-z][A-Za-z0-9_+#.-]{1,30}\", text)\n    hits.extend(tokens[:8])\n    unique = []\n    seen =\
          \ set()\n    for item in hits:\n        key = item.lower()\n        if key and key not in seen:\n            seen.add(key)\n            unique.append(item)\n    return unique[:16]\n\ndef main(question: str, student_answer: str = \"\", target_level: str = \"考试复习\", diagnosis_depth: str = \"标准\", student_id: str = \"\", class_id: str = \"\", conversation_id: str = \"\", request_id: str = \"\", sync_mode: str = \"\", assistant_task: str = \"qa\") -> dict:\n    question_clean = _clean(question, 1200)\n    student_answer_clean = _clean(student_answer, 2500)\n    target_level_norm = _norm_option(target_level, [\"入门理解\", \"考试复习\", \"代码实践\", \"原理推导\"], \"考试复习\")\n    diagnosis_depth_norm = _norm_option(diagnosis_depth, [\"简洁\", \"标准\", \"深度\"], \"标准\")\n    student_id_clean = _clean(student_id, 80)\n    class_id_clean = _clean(class_id, 80)\n    conversation_id_clean = _clean(conversation_id, 120)\n    request_id_clean = _clean(request_id, 120)\n    sync_mode_clean = _clean(sync_mode, 40)\n    assistant_task_clean = _clean(assistant_task, 40) or \"qa\"\n\n    has_answer = bool(student_answer_clean)\n    diagnosis_mode = \"学习诊断模式\" if has_answer else \"知识问答模式\"\n    task_hints = {\n        \"qa\": \"课程问答 资料依据 概念解释\",\n        \"explain\": \"分层讲解 原理 例子 易错点\",\n        \"guided\": \"提示 追问 前置知识 引导\",\n        \"practice\": \"题库 练习 标准答案 答案解析\",\n        \"grade\": \"评分标准 错因标签 缺漏点 批改建议\",\n        \"plan\": \"学习路径 教学设计 学情分析 分层补救\",\n    }\n    task_hint = task_hints.get(assistant_task_clean, \"课程问答 资料依据\")\n    keywords = _extract_keywords(question_clean + \" \" + student_answer_clean + \" \" + task_hint)\n    keyword_text = \" \".join(keywords)\n\n    rag_query = f\"\
          {question_clean} {keyword_text} 学习目标:{target_level_norm} 任务:{assistant_task_clean} {task_hint}\".strip()\n    if has_answer:\n        rag_query = f\"{rag_query} 学生理解摘要:{student_answer_clean[:220]}\"\n    misconception_query = f\"常见误区 易混淆 评分标准 错因标签 {task_hint} {question_clean} {keyword_text} {student_answer_clean[:260]}\".strip()\n\n    return {\n        \"question_clean\": question_clean,\n        \"student_answer_clean\": student_answer_clean,\n        \"target_level_norm\": target_level_norm,\n        \"diagnosis_depth_norm\": diagnosis_depth_norm,\n        \"diagnosis_mode\": diagnosis_mode,\n        \"has_student_answer\": \"true\" if has_answer else \"false\",\n        \"candidate_keywords\": json.dumps(keywords, ensure_ascii=False),\n        \"rag_query\": rag_query[:1500],\n        \"misconception_query\": misconception_query[:1500],\n        \"student_id_clean\": student_id_clean,\n        \"class_id_clean\": class_id_clean,\n        \"conversation_id_clean\": conversation_id_clean,\n        \"request_id_clean\": request_id_clean,\n        \"sync_mode_clean\": sync_mode_clean,\n    }"
        code_language: python3
