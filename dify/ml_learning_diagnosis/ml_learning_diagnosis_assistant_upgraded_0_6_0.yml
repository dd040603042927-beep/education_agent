    - data:
        desc: 从开始节点已传入的项目上下文中构造项目知识图谱证据，返回与原 HTTP 节点兼容的 body，避免测试运行未传 graph_context_url 时出现 url is required，也避免本地地址触发 Dify SSRF 拦截。
        selected: false
        title: 项目知识图谱数据库_代码节点
        type: code
        code: |
          import json
          import re

          def _text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value.strip()
              try:
                  return json.dumps(value, ensure_ascii=False)
              except Exception:
                  return str(value).strip()

          def _context_docs(label, value, limit=3):
              text = _text(value)
              if not text:
                  return []
              chunks = [p.strip() for p in re.split(r"\n\s*\n|(?<=。)\s*", text) if p.strip()]
              docs = []
              for index, chunk in enumerate(chunks[:limit], 1):
                  docs.append({
                      "title": f"{label}{index}",
                      "content": chunk[:900],
                      "score": max(0.1, 0.72 - (index - 1) * 0.05),
                      "source": "project-knowledge-graph-context",
                      "source_type": "项目知识图谱数据库",
                  })
              return docs

          def _graph_docs(value, limit=8):
              text = _text(value)
              if not text:
                  return []
              try:
                  payload = json.loads(text)
              except Exception:
                  return _context_docs("项目知识图谱上下文", text, min(limit, 3))
              if isinstance(payload, dict):
                  for key in ["documents", "result", "records", "data"]:
                      if isinstance(payload.get(key), list):
                          payload = payload[key]
                          break
                  else:
                      payload = [payload]
              if not isinstance(payload, list):
                  return []
              docs = []
              for index, item in enumerate(payload[:limit], 1):
                  if isinstance(item, dict):
                      content = _text(item.get("content") or item.get("text") or item.get("quote") or item)
                      title = _text(item.get("title") or item.get("nodeLabel") or item.get("sourceName") or f"项目知识图谱节点{index}")
                      try:
                          score = float(item.get("score") or item.get("similarity") or 0.75)
                      except Exception:
                          score = 0.75
                      source_type = _text(item.get("source_type") or item.get("sourceType") or "项目知识图谱数据库")
                      if source_type == "project_knowledge_graph":
                          source_type = "项目知识图谱数据库"
                      docs.append({
                          "title": title,
                          "content": content[:900],
                          "score": score,
                          "source": "project-knowledge-graph-context",
                          "source_type": source_type,
                          "graphId": _text(item.get("graphId") or item.get("graph_id")),
                          "nodeId": _text(item.get("nodeId") or item.get("node_id")),
                      })
                  else:
                      docs.append({
                          "title": f"项目知识图谱节点{index}",
                          "content": _text(item)[:900],
                          "score": 0.75,
                          "source": "project-knowledge-graph-context",
                          "source_type": "项目知识图谱数据库",
                      })
              return [doc for doc in docs if doc.get("content")]

          def main(
              question="",
              request_user_id="",
              request_user_role="",
              subject="",
              chapter="",
              knowledge_point="",
              graph_id="",
              node_id="",
              project_graph_context="",
              assistant_role_context="",
              project_mastery_context="",
              project_class_context="",
          ) -> dict:
              docs = _graph_docs(project_graph_context, 8)
              summary_parts = []
              for label, value in [
                  ("用户", request_user_id),
                  ("角色", request_user_role),
                  ("学科", subject),
                  ("章节", chapter),
                  ("知识点", knowledge_point),
                  ("图谱ID", graph_id),
                  ("节点ID", node_id),
                  ("问题", question),
              ]:
                  text = _text(value)
                  if text:
                      summary_parts.append(f"{label}: {text}")
              has_project_graph_hint = any([
                  _text(graph_id),
                  _text(node_id),
                  _text(chapter),
                  _text(knowledge_point),
                  _text(project_graph_context),
                  _text(project_mastery_context),
                  _text(project_class_context),
                  _text(assistant_role_context),
              ])
              if summary_parts and has_project_graph_hint:
                  docs.append({
                      "title": "项目知识图谱查询上下文",
                      "content": "；".join(summary_parts),
                      "score": 0.62,
                      "source": "project-knowledge-graph-context",
                      "source_type": "项目知识图谱数据库",
                  })

              docs.extend(_context_docs("项目学生画像与掌握度", project_mastery_context, 2))
              docs.extend(_context_docs("项目班级与教学上下文", project_class_context, 2))
              docs.extend(_context_docs("项目角色与任务上下文", assistant_role_context, 2))

              payload = {
                  "ok": True,
                  "source": "project-knowledge-graph-context",
                  "request_user_id": _text(request_user_id),
                  "graph_id": _text(graph_id),
                  "node_id": _text(node_id),
                  "documents": docs[:8],
              }
              return {
                  "status_code": 200,
                  "body": json.dumps(payload, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          body:
            children: null
            type: string
          status_code:
            children: null
